name: CD (AWS + Keycloak)

on:
  workflow_run:
    workflows: ["CI Pipeline Validation"]
    types:
      - completed
    branches:
      - main

jobs:
  create-instance-and-deploy:
    name: Deploy Infrastructure and App
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -var="key_name=${{ vars.KEY_NAME }}" -auto-approve

      - name: Get EC2 Public IP
        id: tf-output
        working-directory: ./terraform
        run: |
          RAW_OUTPUT=$(terraform output -raw instance_public_ip)
          CLEAN_IP=$(echo $RAW_OUTPUT | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          echo "EC2_IP=$CLEAN_IP" >> $GITHUB_ENV

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.EC2_IP }} >> ~/.ssh/known_hosts

      - name: Run Ansible Configuration
        working-directory: ./ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          echo "${{ secrets.VAULT_PASSWORD }}" > .vault_pass.txt

          ansible-playbook -i "${{ env.EC2_IP }}," playbook.yaml \
            --vault-password-file .vault_pass.txt \
            -u ubuntu \
            --private-key ~/.ssh/id_rsa

          rm .vault_pass.txt
name: CI Pipeline Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-terraform:
    name: Validate Terraform Format and Syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Lint
        run: terraform validate
      
      - name: Terraform Plan
        id: tf-plan
        working-directory: ./terraform
        run: terraform plan -no-color
        continue-on-error: true
      
      - name: Comment Terraform Plan Output
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          header: "Terraform Plan Output"
          message: |
            ```
            ${{ steps.tf-plan.outputs.stdout }}
            ```

  validate-ansible:
    name: Validate Ansible Playbook Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ansible Lint
        run: pip install ansible-lint

      - name: Run ansible-lint
        run: ansible-lint ansible/playbook.yaml

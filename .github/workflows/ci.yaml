name: CI Pipeline Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  validate-terraform:
    name: Validate Terraform Format and Syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Lint
        run: terraform validate

      - name: Terraform Plan
        id: tf-plan
        working-directory: ./terraform
        run: terraform plan -no-color -var="key_name=${{ vars.KEY_NAME }}" -input=false
        continue-on-error: true

      - name: Comment Plan on Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.tf-plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### 🏗️ Terraform Plan Preview
            Resultado: \`${{ steps.tf-plan.outcome }}\`
            
            <details><summary><strong>Clique para expandir e ver o plano completo</strong></summary>

            \`\`\`hcl
            ${process.env.PLAN}
            \`\`\`
            
            </details>

            *Acionado por: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  validate-ansible:
    name: Validate Ansible Playbook Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ansible Lint
        run: pip install ansible-lint

      - name: Run ansible-lint
        run: ansible-lint ansible/playbook.yaml
